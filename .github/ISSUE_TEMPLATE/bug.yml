name: Bug report
description: Something in Wisdom Pro doesn't work as it should.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Everything here is public, so please leave out personal details, licence keys and private audio.
  - type: input
    id: version
    attributes:
      label: Wisdom Pro version
      description: Help › About Wisdom Pro (e.g. 0.1.4)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options: [Mac (Apple silicon), Mac (Intel), Windows, Web version]
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio interface / output (if it's about sound)
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps to make it happen again, as exactly as you can.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, short clips, anything else
      description: Drag images or short files here.
